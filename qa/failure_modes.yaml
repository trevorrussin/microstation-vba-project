- id: FM-014
  applies: [cad.drafting, cad.classify.curb, engineering.calc, generic]
  mode: "A governing standard or requirement is never identified, so no check exists for it and every implemented check still passes."
  effect: "Noncompliant drawing with a green gate."
  detection: "STD-DISP-01 (every search candidate dispositioned), COV-01 (requirements derived from the measured change set; unverified/engineer-review listed; candidate gaps listed)"
- id: FM-015
  applies: [cad.drafting]
  mode: "An edit op reports OK but did not do what was commanded (wrong offset distance/side, wrong rotation direction, break point off the line, text style changed by an edit) while every CAD-hygiene rule passes; or the agent's own expectation encodes the wrong value."
  effect: "Geometrically wrong plan with a green gate; the agent graded its own work."
  detection: "OP-01 (op_recorder before/after read-back re-measured by qa/operations.py contracts; request numbers/directions cross-checked), REQ-GEOM-01 (qa_gate expect --rel)"
  incident: "2026-10-23 audit: 'move a line' only checked hygiene; BREAK_LINE places the break at the clicked point without projecting onto the line"
