  incident: "2026-10-01 Loc11-12"
- id: FM-012
  applies: [cad.drafting]
  mode: "New text placed with a different height/width/font than the sheet's existing notes, or in profile clutter; gate passed because text size was never read back."
  effect: "Annotation looks wrong on the sheet; engineer rework; false PASS."
  detection: "CAD-TXT-02 (style vs sheet text), CAD-TXT-03 (text-text), CAD-TXT-04 (text-line), VIS-01 render draws real text size/rotation"
  incident: "2026-10-23 profile sheet RW labels 0.003x0.010 vs notes 0.007x0.007"
- id: FM-013
  applies: [cad.drafting]
  mode: "New text sits on a new line/polyline; gate only checked text-on-text (CAD-TXT-03) and treated line range-AABB as the obstacle (false-positive for diagonals) or skipped lines entirely."
  effect: "Labels unreadable on plot; false PASS on profile/plan annotations."
  detection: "CAD-TXT-04 segment-vs-text-box clearance using get_element_vertices paths"
  incident: "2026-10-23 profile RW TOW labels on wall lines; engineer: check text overlaps with lines"
- id: FM-013
  applies: [cad.drafting]
