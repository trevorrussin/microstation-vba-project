- id: FM-020
  applies: [cad.drafting, generic]
  mode: "A past investigation that ended unresolved or handed to the engineer is later treated as a known solution, or a failed approach is repeated because nothing recorded that it failed."
  effect: "Repeated dead ends; an unverified cause reported as fact."
  detection: "mcp-server/experience.py (status resolved|unresolved|handed_off; findings carry observed|reported|inferred, hypotheses are never stored as findings); qa_gate start prints the closest rows; tests/qa/test_diagnostic_ladder.py"
- id: FM-021
  applies: [cad.drafting, generic]
  mode: "A production request (change the engineer's drawing) turns into capability development: the agent edits or rebuilds the bridge, VBA modules, add-in or key-in registry, or probes undocumented APIs, on the engineer's real file."
  effect: "Disproportionate work, an unreviewed change to the tooling, and experiments on a production drawing."
  detection: "scripts/qa_mode_hook.py (PreToolUse) refuses edits to tooling paths and loader commands while a production task is open; development tasks need --scratch <file.dgn|none> and --mode-reason; --scratch none makes task_guard refuse every drawing edit"
  incident: "2026-10-24 circles run: a display request ended in rebuilding an add-in and probing OpenRoads internals"
