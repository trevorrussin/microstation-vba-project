  effect: "Many unrecorded changes to the engineer's file, an unfinished task, and a conclusion stated more strongly than the evidence (a hypothesis reported as the cause)."
  detection: "PROC-01 (event log: task before edit, read before edit, at most 2 failed edits in a row, replan needs new reading, blocked needs an escalation reason); task_guard ReplanRequired; scripts/qa_pretool_hook.py (COM scripts); qa_gate claim labels (close refuses open hypotheses)"
