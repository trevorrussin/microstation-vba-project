  effect: "Fragile or unrecorded methods, and invented procedures for unsupported operations."
  detection: "mcp-server/capabilities.py find_capability (qa_gate start prints it): FOUND with status and method from Data/capabilities/policy.yaml, or UNSUPPORTED with the mode's instruction"
