# Failure-mode catalog (FMEA-lite). qa_gate.py prints the rows matching a task's type at
# task START (so the agent plans against them) and every row names the check that detects it.
# Add a row for every engineer correction or incident; link the detecting check.

- id: FM-001
  applies: [cad.classify.curb, cad.drafting, generic]
  mode: "Silent COM failure - early-bound property (Length, Coordinate) raises, caught, value replaced by default."
  effect: "Wrong quantities that still \"pass\" (0.01 ft per line; 0 flares -> Depressed short 2-3 ft)."
  cause: "win32com early binding lacks members on IAcadEntity; broad except swallowed it."
  detection: "CURB-GATE-01 (late-bound recompute), unit fixtures in tests/qa/"
  mitigation: "Late-bind (win32com.client.dynamic.Dispatch); COM exception -> UNCERTAIN, never default."
  incident: "2026-10-01 curb batch"
- id: FM-002
  applies: [cad.classify.curb]
  mode: "Wrong drawing in the file (sheet saved with another sheet's content)."
  effect: "Classified and quantified the wrong location; presence-only gate passed."
  detection: "CURB-ID-01"
  mitigation: "Identity check before any content check."
  incident: "2026-10-01 Loc10_SGD = Loc03-04"
